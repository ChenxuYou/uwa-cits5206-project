services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ric-costing:local
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CostingDb: Data Source=/app/data/ric-costing-v7.db
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
